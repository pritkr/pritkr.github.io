<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOSS for Everyone · RKD College</title>
<style>
:root{--bg:#fffaf0;--ink:#12375f;--mut:#5d7188;--line:#dce6ef;--y:#ffd33f;--b:#eaf4ff;--m:#e6f6ec;--p:#fff0eb;--ys:#fff1a6}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 92% 4%,rgba(255,211,63,.35),transparent 26%),radial-gradient(circle,rgba(25,82,140,.12) 1.5px,transparent 2px) 0 0/22px 22px,var(--bg)}
.s{position:absolute;inset:0;padding:5vh 7vw 4vh;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .3s}
.s.on{opacity:1;visibility:visible}
.top,.ft{display:flex;justify-content:space-between;align-items:center;font-size:clamp(12px,1.1vw,15px);font-weight:700;color:var(--mut)}
.bd{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;max-width:1180px;width:100%;margin:0 auto}
h1,h2{margin:0;font-weight:900;letter-spacing:-.045em;line-height:1}
h1{font-size:clamp(52px,9vw,128px)}h2{font-size:clamp(32px,5vw,72px);max-width:20ch}
.big h2{font-size:clamp(40px,7vw,104px);max-width:16ch}
mark{background:var(--y);color:inherit;padding:0 .12em .04em;border-radius:.12em}
.l{margin:.7em 0 0;font-size:clamp(16px,1.9vw,27px);line-height:1.35;color:#3d5f82;max-width:34em}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.pills i{font-style:normal;font-weight:800;font-size:clamp(13px,1.3vw,18px);background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:999px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin-top:clamp(18px,3.5vh,36px)}
.g.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.c{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.4vh,26px);box-shadow:0 12px 28px rgba(15,55,100,.08)}
.c b{display:block;font-size:clamp(18px,2.2vw,32px);letter-spacing:-.025em;line-height:1.1}
.c span{display:block;margin-top:.5em;font-size:clamp(13px,1.4vw,19px);line-height:1.35;color:var(--mut)}
.c.b{background:var(--b)}.c.y{background:var(--ys);border-color:#f1dc72}.c.m{background:var(--m)}.c.p{background:var(--p)}
.st{list-style:none;margin:clamp(18px,3.5vh,34px) 0 0;padding:0;display:grid;gap:10px;counter-reset:n;max-width:860px}
.st li{counter-increment:n;display:grid;grid-template-columns:44px 1fr;column-gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 18px}
.st li:before{content:counter(n);grid-row:span 2;width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900}
.st b{font-size:clamp(16px,1.9vw,26px)}.st span{font-size:clamp(12px,1.3vw,17px);color:var(--mut)}
.ft .dots{display:flex;gap:6px}.ft .dots u{width:26px;height:6px;border-radius:3px;background:#d5dfea;text-decoration:none}.ft .dots u.d{background:var(--ink)}.ft .dots u.n{background:var(--y)}
#bar{position:fixed;left:0;top:0;height:5px;background:var(--y);width:0;transition:width .3s}
#notes{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:16px 7vw;font-size:clamp(14px,1.5vw,19px);line-height:1.4;transform:translateY(100%);transition:transform .25s;z-index:9}#notes.on{transform:none}
#tm{position:fixed;right:24px;top:24px;font-size:clamp(40px,6vw,88px);font-weight:900;background:var(--y);padding:4px 22px;border-radius:20px;display:none;z-index:8}#tm.on{display:block}
.ctl{position:fixed;right:14px;bottom:44px;display:flex;gap:6px;z-index:7;opacity:.55}.ctl button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:6px 11px;font-weight:800;cursor:pointer}.ctl button:hover{opacity:1}
.logos{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}.logos img{height:clamp(44px,7vh,72px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 10px}.bd.me{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(24px,4vw,60px)}.bd.me>div:last-child{flex:1 1 340px;min-width:0}.ph{flex:none;width:clamp(170px,24vw,330px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:7px solid #fff;box-shadow:0 18px 40px rgba(15,55,100,.18);background:var(--y)}.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="bar"></div><div id="tm"></div>
<div class="ctl"><button id="pv" aria-label="Previous">←</button><button id="nx" aria-label="Next">→</button><button id="nb">Notes</button><button id="tb">Timer</button></div>
<div id="notes"></div>
<script>
const A=["Why you","Learn","Do","Meaning","Next"];
const S=[
["hero",0,"0:00","FOSS for <mark>everyone.</mark>","Introduction to FOSS and an OpenStreetMap workshop",["Prit Kumar · 6 Oct 2026 · Seminar Hall"],"Silence 3 sec, scan, smile. Then: Good afternoon."],
["big",0,"0:00","“Hum Arts ke students hain. Humara kya kaam?”","Hands up if the poster made you think this.",0,"Say their doubt first. Promise: no coding, no exam, no jargon test. Warm: add “bas attendance lagwa lo?” Quiet: hands only, “aap akele nahi ho”. Distracted: “phone mein sabse zyada kaun si app?” pair talk 20 sec."],
["two",0,"0:02","AI learned from <mark>us.</mark>","Digital agency: be a participant in technology, not only a user.",[["Wikipedia, books, maps, websites","Everything AI knows, people wrote and shared first.","b"],["Open source","The most powerful way to keep sharing knowledge.","y"]],"AI question. Warm: “AI se kya karwaya hai?” Quiet: hand count by name. Distracted: “AI ne kab galat jawab diya?” to neighbour. We became passive consumers; today changes that."],
["me",0,"0:04","Hi, I’m <mark>Prit.</mark>","Engineering student. I build small open-source tools and help students find their way into FOSS.",[["Predirect","A browser extension I built. 1,000+ people use it.","y"],["FOSS United","Session Facilitator for India’s non-profit that supports the FOSS community with events, meetups and grants.","b"],["At my college","We run a FOSS club, shifting from rote learning to tinkering.","m"]],"One casual line of credibility, never twice. Same exams, same “ab aage kya?” tension. Then: aap kaun ho, aur hum aapko ye kyun sikha rahe hain?"],
["cards",0,"0:05","Who is in this room?","Future teachers, journalists, civil servants, researchers, NGO leaders, creators. Not coders, and that is fine.",[["Every career","Software, data and maps will show up wherever you work.","b"],["No budget wall","Many of the best tools are open and free.","m"],["Communities need you","Writers, translators, designers, organisers.","y"],["A practice ground","Work with people you have never met. No fees, no permission.","p"]],"One line of credibility: student, Predirect (1,000+ users), FOSS United. Career poll: “paanch saal baad kya banna chahte ho?” Note the top 3 groups for the match-goals slide."],
["steps",0,"0:07","Four goals before we finish","This is your college’s first FOSS workshop. You are the pioneers.",[["Explain FOSS in one minute"],["Make one real contribution to the world map"],["See why it matters for career and community"],["Know your next step: the FOSS club"]],"Read slowly. Pioneers line lands the room."],
["steps",1,"0:08","Open <mark>osm.org</mark> and sign up","Editing needs an account so someone can help if a mistake happens.",[["Pair up","One device per pair is enough."],["Sign Up with a nickname","No real name needed. Your email stays private."],["Leave the email for now","It will arrive while we learn FOSS."]],"2 min. Fix only stuck screens, then move on."],
["two",1,"0:10","Same dish, <mark>two kitchens.</mark>","The recipe is the source code.",[["Closed: the restaurant","You can enjoy the litti-chokha. The recipe stays locked in a safe.","p"],["Open: dadi’s diary","You ask, write it down, share it, a friend adds kesar and improves it.","m"]],"Litti-chokha story, then dadi’s diary. Warm: “ghar mein secret recipe?” Quiet: hands. Distracted: stand if recipes should be shared (nobody forced)."],
["cards",1,"0:13","FOSS means <mark>freedom.</mark>","Free and Open Source Software. Free as in freedom, not price. A license gives the freedom, with credit and rules.",[["Chalao","Use it","b"],["Samjho","Study how it works","m"],["Baanto","Share it","y"],["Sudharo","Improve it","p"]],"Teach the call-and-response: say it slowly, “saath mein”. Mention Creative Commons for their own essays, photos, designs."],
["cards",1,"0:15","Open or closed?","You already use FOSS every day. AI has both kinds: locked models and open-weight ones like Llama, Mistral, Qwen, Gemma.",[["Wikipedia","Open","b"],["WhatsApp","Closed","p"],["VLC","Open","b"],["Firefox","Open","b"]],"Warm: they name apps. Quiet: you name, they vote. Distracted: stand = open, sit = closed. Open-weight is not the same as fully open source. AI suggests, I decide: your strength is questions and context."],
["cards",2,"0:17","OpenStreetMap: the Wikipedia of <mark>maps</mark>","First, confirm your email, then add a Note near the college gate.",[["A Note comes first","Search the college. Add one true thing missing from the map.","y"],["A commons","Public data any volunteer can improve. © OpenStreetMap contributors.","b"],["AI proposes, humans verify","AI can suggest buildings. Only you know the name of your lane.","m"]],"Confirm 1 min, Note 1.5 min. Warm: “gate ke paas kaun si dukaan map par nahi?” Cut if late: Haiti 2010, Nepal 2015, fAIr."],
["steps",2,"0:21","Five rules for safe editing","No “test” or “hello” entries. That counts as vandalism.",[["Map only what you have seen or know"],["Never copy from Google Maps or ask AI for facts"],["One pair, one place. Check for duplicates first"],["No private homes, names or phone numbers"],["Not sure? Add a Note, not an edit"]],"Read slowly. Some students may be 16-17: nicknames only, no personal info."],
["steps",2,"0:23","Watch one edit, start to finish","Narrate every click.",[["Edit, then Edit with iD","Skip the long tutorial for now."],["Point tool","Click where the place is."],["Pick the type","For example Pharmacy."],["Name it as people say it","Add the Hindi name too. That is the arts part."],["Save with a comment","Added [place] near RKD College, Patna #RKDFOSS"]],"2 min. Make one real edit. Ask: “is jagah ko log kis naam se bulate hain?”"],
["cards",2,"0:25","Your turn: one <mark>real place</mark>","Check the map first. Add a Point, name it, Save, comment #RKDFOSS. Press T for the 7:00 timer.",[["Rows 1","Medical, pharmacy, clinic","b"],["Rows 2","Food, tea stall, mess","y"],["Rows 3","Coaching, school, library","m"],["Rows 4","Transport, ATM, bank","p"],["Rows 5","Temple, mosque, church, park","b"],["Rows 6","Anything else you know","y"]],"Leave the stage, stand behind shoulders. Finished early: fix a spelling, add a Hindi name, or mark wheelchair access if sure. Min 4 check: Warm “first Save, stand up!” Quiet: one-to-one. Distracted: point at the timer."],
["big",2,"0:35","You are now an open-source <mark>contributor.</mark>","Strangers, in public, on an open project. Find your edits in History.",0,"Open osm.org, History, Kankarbagh. Read nicknames aloud. Applause, then chant: Chalao, Samjho, Baanto, Sudharo. Tomorrow a volunteer reviews: that is review culture."],
["two",3,"0:38","Why open collaboration works","Everything is public, written and reviewed, so thousands of strangers can build together.",[["The group-project way","Five people, five versions, final_final_v3_REAL.docx. Nobody knows what is latest.","p"],["The open way","One place. Every change recorded. Anyone can suggest. A review before it joins.","m"]],"Energy reset first (high-five / neighbour line / 10 sec stretch). Warm: “final_final_v3 experience?”"],
["cards",3,"0:40","Europe asked the same question","What if your college ran on one company’s software, and it doubled the price?",[["3 June 2026","The European Commission presents a standalone Open Source Strategy.","b"],["Why it matters","See the code, switch providers, share costs.","y"],["Honest note","A strategy, not a law. Rivals still share a base like Linux.","p"]],"Ask first: “aap kya karoge?” Public Money, Public Code is a campaign slogan, not an EU law. Competition upar, cooperation neeche."],
["cards",3,"0:42","Work like a <mark>newsroom</mark>","Reporter writes (your edit). Sub-editor checks (the review). Editor publishes (the merge).",[["Ask clearly","What I tried, what I expected, what happened.","b"],["Feedback is about the work","The review is not about your worth.","m"],["Not sure? Ask","Add a Note. Do not invent certainty.","y"]],"Three habits that travel to any job. Newspaper desk can be cut if late."],
["cards",3,"0:45","Proof, people, <mark>practice</mark>","No job guarantee. Something better: evidence.",[["Proof","A link anyone can open. “Maine 20 public places map kiye.”","b"],["People","Mentors and collaborators find you because they saw your work.","y"],["Practice","Learning with strangers, taking feedback, working in public. Tools change; this stays.","m"]],"Add your real Predirect moment: first bug report or first thank-you from a stranger. Warm vote: a certificate or a link? Optional student A/B story."],
["cards",3,"0:49","What do you <mark>care about?</mark>","Not “how do I become a programmer?” but “how can open technology improve what I already care about?”",[["Journalism","Open data, mapping, verification","b"],["Design and media","Inkscape, Krita, GIMP, Kdenlive, Audacity","y"],["Teaching","Free resources, Wikipedia, Wikisource","m"],["Policy and social work","Open data, civic maps, accessibility","p"],["Language and literature","Translation. Maithili, Bhojpuri, Magahi need speakers.","b"],["Business","Cheaper experiments, open tools, communities","y"]],"Only do the groups you saw hands for in the career poll. One sentence each when the room is distracted."],
["steps",4,"0:52","Your next step: a <mark>FOSS club</mark>","A student community that meets, learns and builds together. Roles are not only technical: outreach, content, design, events, community. One idea for the first month:",[["Week 1","10 interested students and a faculty coordinator"],["Week 2","Campus mapathon"],["Week 3","Wikipedia or Wikisource edit session"],["Week 4","Show-and-tell"]],"Ask: “kaun club ka hissa banna chahta hai?” Quiet room: sign-up sheet or QR at the door. Registration and details will be announced through the T&P Cell and YDF, so do not promise a formal RKD club. It adds to exam prep, it does not compete with it. fossunited.org."],
["big",4,"0:54","“Hum Arts walon ka <mark>kya kaam?</mark>”","The last 100 years were written in books by Arts and Humanities people. The next 100 are digital. You will help decide.",0,"Recap: Chalao, Samjho, Baanto, Sudharo; collaboration from Europe to your mohalla; your first contribution. Ask, pause, then answer."],
["cards",4,"0:56","Try. Join. <mark>Contribute.</mark>","Your first contribution does not need to be impressive. Bas hona chahiye.",[["Try one open tool","Something tied to what you care about.","b"],["Join one community","Ask, learn, help someone.","y"],["Make one small contribution","A typo, a translation, a map detail.","m"]],"Before the semester ends. End: Let’s build a better digital future, together. Stay on stage."],
["cards",4,"0:57","Questions, and one <mark>open door</mark>","Take two or three. Then: baaki sawaal ke liye main bahar hoon.",[["osm.org","Keep mapping with local knowledge.","y"],["fossunited.org","Communities, events, opportunities.","b"],["#RKDFOSS","Your edits, the club, what comes next.","m"]],"Q&A bank: coding not required; free software still has business models; safe if official sources; jobs no guarantee; AI jobs: nobody knows. Quiet room: seed a question or use paper slips. Thank you."]
];

const root=document.body;let i=0,iv=null;
const card=c=>`<div class="c ${c[2]||""}"><b>${c[0]}</b>${c[1]?`<span>${c[1]}</span>`:""}</div>`;
S.forEach((s,n)=>{const [k,a,t,h,l,c]=s;const H=k=="hero"?"h1":"h2";
let body=`<${H}>${h}</${H}>${l?`<p class="l">${l}</p>`:""}`;
if(k=="hero")body+=`<div class="pills">${c.map(x=>`<i>${x}</i>`).join("")}</div><div class="logos"><img src="${IMG.y}" alt="Youth Dreamers Foundation"><img src="${IMG.r}" alt="Ram Krishna Dwarika College"><img src="${IMG.f}" alt="FOSS United"></div>`;
else if(k=="steps")body+=`<ol class="st">${c.map(x=>`<li><b>${x[0]}</b>${x[1]?`<span>${x[1]}</span>`:""}</li>`).join("")}</ol>`;
else if(c)body+=`<div class="g ${k=="two"?"two":""}">${c.map(card).join("")}</div>`;
if(k=="me")body=`<div class="ph"><img src="${IMG.p}" alt="Prit Kumar"></div><div><h2>${h}</h2><p class="l">${l}</p><div class="g">${c.map(card).join("")}</div><div class="logos"><img src="${IMG.f}" alt="FOSS United"></div></div>`;
const d=document.createElement("section");d.className="s";
d.innerHTML=`<div class="top"><span>${A[a]}</span><span>${n+1} / ${S.length}</span></div><div class="bd ${k}">${body}</div><div class="ft"><span>Elapsed ${t}</span><span class="dots">${A.map((_,j)=>`<u class="${j<a?"d":j==a?"n":""}"></u>`).join("")}</span></div>`;
root.appendChild(d)});
const sl=[...document.querySelectorAll(".s")],nt=document.getElementById("notes"),tm=document.getElementById("tm");
function show(n){i=Math.max(0,Math.min(sl.length-1,n));sl.forEach((s,j)=>s.classList.toggle("on",j==i));document.getElementById("bar").style.width=(i+1)/sl.length*100+"%";nt.textContent=S[i][6];document.title=`FOSS for Everyone · ${i+1}/${sl.length}`;history.replaceState(null,"","#"+(i+1))}
function timer(){clearInterval(iv);let t=S[i][1]==2&&S[i][3].includes("real place")?420:60;const f=()=>{tm.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;if(t--<=0)clearInterval(iv)};tm.classList.add("on");f();iv=setInterval(f,1000)}
const stop=()=>{clearInterval(iv);tm.classList.remove("on")};
pv.onclick=()=>show(i-1);nx.onclick=()=>show(i+1);nb.onclick=()=>nt.classList.toggle("on");tb.onclick=timer;
document.addEventListener("keydown",e=>{const k=e.key;if(["ArrowRight","PageDown"," ","Enter"].includes(k)){e.preventDefault();show(i+1)}else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();show(i-1)}else if(k=="Home")show(0);else if(k=="End")show(sl.length-1);else if(k=="n"||k=="N")nt.classList.toggle("on");else if(k=="t"||k=="T")timer();else if(k=="f"||k=="F")document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else if(k=="Escape"){stop();nt.classList.remove("on")}});
let x=null;addEventListener("touchstart",e=>x=e.changedTouches[0].clientX,{passive:true});addEventListener("touchend",e=>{if(x==null)return;const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)show(i+(d<0?1:-1));x=null},{passive:true});
const h=parseInt(location.hash.slice(1));show(h>=1&&h<=sl.length?h-1:0);
</script></body></html>
